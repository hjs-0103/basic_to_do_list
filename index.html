<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <img src="to-do-list.png" width="80px" class="main-img">
        <h1 id="main-heading">My To-Do's</h1>
        <div id="user-input"><input type="text" placeholder="Enter daily task..." id="input"></input><button
                class="create">Create</button></div>
    </div>

    <div class="list-container">
        <h2>To-Do:</h2>
        <ul class="list">


        </ul>
    </div>

    <div class="list-container">
        <h2>Completed tasks:</h2>
        <div class="finished-items">

        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
